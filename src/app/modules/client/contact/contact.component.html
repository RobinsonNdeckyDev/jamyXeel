<div class="d-flex justify-content-center align-items-center vh-100 bg-primary">
    <form [formGroup]="myData" (ngSubmit)="onSubmit()" class="w-50 bg-white p-3 rounded">
        <h2 class="text-center text-primary text-capitalize fw-bolder">Contactez-nous</h2>
        <div class="row">
            <div class="col mb-3">
                <label for="prenom">Prenom</label>
                <input type="text" id="prenom" name="prenom" class="form-control" formControlName="prenom">
            </div>

            <div class="col">
                <label for="nom">Nom</label>
                <input type="text" id="nom" name="nom" class="form-control" formControlName="nom">
            </div>
        </div>

        <div class="mb-3">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" class="form-control" formControlName="email">
        </div>

        <div class="mb-3">
            <label for="message" class="d-block">Message</label>
            <textarea name="message" id="message" class="form-control" formControlName="message"></textarea>
        </div>

        <div>
            <button [disabled]="myData.invalid" type="submit" class="w-100 btn btn-primary">Envoyer message</button>
        </div>
    </form>
</div>
